<!--
  Aura — warstwa stylów dla powiadomień transakcyjnych Shopify.

  WKLEJ CAŁOŚĆ TEGO PLIKU (razem ze znacznikami <style> i </style>)
  w sekcji <head> szablonu, bezpośrednio pod linijką:

      <link rel="stylesheet" type="text/css" href="/assets/notifications/styles.css">

  Jeśli w podglądzie Shopify widzisz CSS jako tekst, znaczy że znaczniki
  <style> zginęły albo blok wylądował poza <head>.
-->
<style>
  /*
    Fractul jest progresywnym ulepszeniem: Apple Mail i iOS Mail honorują
    @font-face, Gmail / Outlook / Yahoo go usuwają. Fallback na
    Helvetica/Arial jest świadomy, nie przypadkowy.

    Wszystko ma !important, bo notifications/styles.css Shopify ładuje się
    wcześniej i miejscami ma wyższą specyficzność.
  */
  @font-face {
    font-family: "Fractul";
    src: url("https://aura-storefront-chi.vercel.app/assets/fonts/Fractul-Regular.woff2") format("woff2");
    font-style: normal;
    font-weight: 400;
  }
  @font-face {
    font-family: "Fractul";
    src: url("https://aura-storefront-chi.vercel.app/assets/fonts/Fractul-SemiBold.woff2") format("woff2");
    font-style: normal;
    font-weight: 600;
  }
  @font-face {
    font-family: "Fractul";
    src: url("https://aura-storefront-chi.vercel.app/assets/fonts/Fractul-ExtraBold.woff2") format("woff2");
    font-style: normal;
    font-weight: 800;
  }

  body, table, td, p, a, span, h1, h2, h3, h4 {
    font-family: "Fractul", "Helvetica Neue", Helvetica, Arial, sans-serif !important;
  }

  body,
  .body {
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    background-color: #faf8f4 !important;
    color: #0e0e0c !important;
  }

  .container {
    width: 620px !important;
    max-width: 620px !important;
  }

  /* ── Nagłówek ──────────────────────────────────────────────────── */

  .header {
    background-color: #faf8f4 !important;
    border-top: 8px solid #ff4d17 !important;
  }

  .header__cell {
    padding: 32px 0 24px !important;
    border-bottom: 1px solid #e6e2d8 !important;
  }

  .shop-name__cell img {
    display: block !important;
    width: 168px !important;
    max-width: 168px !important;
    height: auto !important;
  }

  .aura-logo-link {
    display: inline-block !important;
    text-decoration: none !important;
  }

  .order-po-number__container {
    margin-left: auto !important;
  }

  .order-number__text,
  .po-number__text {
    color: #6e6a60 !important;
    font-size: 12px !important;
    font-weight: 600 !important;
    letter-spacing: 0.04em !important;
    text-transform: uppercase !important;
  }

  /* ── Wstęp ─────────────────────────────────────────────────────── */

  .content__cell {
    padding: 52px 0 44px !important;
  }

  .content h2 {
    margin: 0 0 18px !important;
    color: #0e0e0c !important;
    font-size: 46px !important;
    font-weight: 800 !important;
    line-height: 0.98 !important;
    letter-spacing: -0.045em !important;
  }

  /*
    email_body niesie własne elementy blokowe, dlatego markup opakowuje go
    w div, a nie w akapit — akapit w akapicie jest automatycznie zamykany
    przez klienta pocztowego, co dawało nierówne odstępy.
  */
  .content__body,
  .content__body p,
  .content p {
    max-width: 540px !important;
    margin: 0 0 12px !important;
    color: #6e6a60 !important;
    font-size: 16px !important;
    line-height: 1.55 !important;
  }

  .content__body h3 {
    margin: 20px 0 6px !important;
    color: #0e0e0c !important;
    font-size: 15px !important;
    font-weight: 600 !important;
    letter-spacing: 0.02em !important;
  }

  /* ── Przyciski ─────────────────────────────────────────────────── */

  .actions {
    margin-top: 26px !important;
  }

  .actions-buttons .button__cell,
  .button.main-action-cell .button__cell,
  .button__cell {
    background-color: #ff4d17 !important;
    border-radius: 999px !important;
  }

  .button__text,
  .button__text:hover,
  .button__text:active,
  .button__text:visited {
    display: block !important;
    padding: 16px 24px !important;
    color: #ffffff !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    text-align: center !important;
    text-decoration: none !important;
  }

  .button__cell--shop-app {
    background-color: #0e0e0c !important;
  }

  .secondary-action-cell,
  .link__cell {
    padding-top: 16px !important;
    color: #6e6a60 !important;
    font-size: 13px !important;
  }

  a,
  a:hover,
  a:active,
  a:visited,
  .link__cell a,
  .disclaimer__subtext a {
    color: #e03a04 !important;
  }

  /* ── Sekcje ────────────────────────────────────────────────────── */

  .section {
    background-color: #faf8f4 !important;
  }

  .section__cell {
    padding: 38px 0 !important;
    border-top: 1px solid #e6e2d8 !important;
  }

  .section h3 {
    margin: 0 0 24px !important;
    color: #0e0e0c !important;
    font-size: 25px !important;
    font-weight: 800 !important;
    line-height: 1.08 !important;
    letter-spacing: -0.03em !important;
  }

  .section h4,
  .customer-info__item h4 {
    margin: 0 0 8px !important;
    color: #0e0e0c !important;
    font-size: 11px !important;
    font-weight: 600 !important;
    letter-spacing: 0.08em !important;
    text-transform: uppercase !important;
  }

  /* ── Karta paragonu ────────────────────────────────────────────── */

  .receipt-section .section__cell {
    padding: 0 0 54px !important;
    border-top: 0 !important;
  }

  .receipt-head,
  .receipt-body {
    background-color: #ffffff !important;
  }

  .receipt-heading-cell {
    padding: 34px 34px 8px !important;
  }

  .receipt-body > tbody > tr > td {
    padding: 0 34px 42px !important;
  }

  .receipt-kicker {
    margin: 0 0 8px !important;
    color: #6e6a60 !important;
    font-size: 10px !important;
    font-weight: 600 !important;
    letter-spacing: 0.16em !important;
    line-height: 1.2 !important;
    text-transform: uppercase !important;
  }

  .receipt-heading-cell h3 {
    margin-bottom: 16px !important;
    font-size: 27px !important;
  }

  .receipt-burst-cell {
    padding-left: 6px !important;
    text-align: right !important;
    vertical-align: middle !important;
  }

  .receipt-burst {
    display: inline-block !important;
    width: 58px !important;
    height: 58px !important;
  }

  /*
    Ząbkowana krawędź. Arial jest wskazany jawnie, bo znak U+25BC musi
    pochodzić z kroju, który go na pewno ma; letter-spacing zostaje na
    zerze, żeby żaden klient nie nałożył trójkątów na siebie ani ich nie
    rozstrzelił, a wysokość wiersza równa się rozmiarowi czcionki, więc
    nic nie może się przyciąć.
  */
  .receipt-tear {
    width: 100% !important;
    table-layout: fixed !important;
  }

  .receipt-tear td {
    height: 16px !important;
    padding: 0 !important;
    overflow: hidden !important;
    background-color: #faf8f4 !important;
    color: #ffffff !important;
    font-family: Arial, Helvetica, sans-serif !important;
    font-size: 16px !important;
    letter-spacing: 0 !important;
    line-height: 16px !important;
    text-align: center !important;
    white-space: nowrap !important;
  }

  /* ── Pozycje zamówienia ────────────────────────────────────────── */

  .order-list__item__cell {
    padding: 18px 0 !important;
    border-bottom: 1px solid #e6e2d8 !important;
  }

  .order-list__product-image,
  .order-list__image {
    border: 1px solid #e6e2d8 !important;
    border-radius: 14px !important;
    background-color: #f3f0e9 !important;
  }

  .order-list__item-title,
  .order-list__item-title span {
    color: #0e0e0c !important;
    font-size: 15px !important;
    font-weight: 600 !important;
    line-height: 1.35 !important;
  }

  .order-list__item-variant,
  .order-list__item-property,
  .order-list__item-discount-allocation {
    color: #6e6a60 !important;
    font-size: 13px !important;
    line-height: 1.45 !important;
  }

  .order-list__price-cell,
  .order-list__item-price {
    color: #0e0e0c !important;
    font-size: 15px !important;
    font-weight: 600 !important;
  }

  /* ── Podsumowanie kwot ─────────────────────────────────────────── */

  .subtotal-table {
    margin-top: 24px !important;
  }

  .subtotal-line__title,
  .subtotal-line__value {
    padding: 7px 0 !important;
    color: #6e6a60 !important;
    font-size: 14px !important;
  }

  .subtotal-line__value {
    color: #0e0e0c !important;
    font-weight: 600 !important;
  }

  /*
    Jedna kreska, jedna wyeksponowana kwota.

    Style są celowo ograniczone do --total. Reguła :last-child bez tego
    ograniczenia trafiała także w ostatni wiersz pierwszej tabeli, przez co
    linia podatku renderowała się jak kwota końcowa zamówienia.

    Wielka liczba ląduje na własnym pierwszym wierszu sumy Shopify, a nie
    na drugiej, ręcznie dopisanej. Dzięki temu wszystkie warianty Shopify
    zostają nietknięte — B2B, terminy płatności, zaokrąglenia gotówkowe,
    płatności częściowe, „Oszczędzasz" — a kwota pojawia się dokładnie raz.
  */
  .subtotal-table--total {
    margin-top: 30px !important;
    padding-top: 26px !important;
    border-top: 2px dashed #0e0e0c !important;
  }

  .subtotal-table--total .subtotal-line:first-child .subtotal-line__title,
  .subtotal-table--total .subtotal-line:first-child .subtotal-line__title span {
    color: #6e6a60 !important;
    font-size: 10px !important;
    font-weight: 600 !important;
    letter-spacing: 0.18em !important;
    text-transform: uppercase !important;
    vertical-align: middle !important;
  }

  .subtotal-table--total .subtotal-line:first-child .subtotal-line__value,
  .subtotal-table--total .subtotal-line:first-child .subtotal-line__value strong {
    color: #ff4d17 !important;
    font-size: 40px !important;
    font-weight: 800 !important;
    letter-spacing: -0.045em !important;
    line-height: 1 !important;
    vertical-align: middle !important;
    white-space: nowrap !important;
  }

  .total-discount,
  .total-discount--amount {
    color: #6e6a60 !important;
    font-size: 13px !important;
  }

  .aura-receipt-thanks {
    margin: 22px 0 0 !important;
    color: #6e6a60 !important;
    font-size: 10px !important;
    font-weight: 600 !important;
    letter-spacing: 0.18em !important;
    line-height: 1.5 !important;
    text-align: center !important;
    text-transform: uppercase !important;
  }

  /* ── Dane klienta ──────────────────────────────────────────────── */

  .customer-info__item {
    width: 50% !important;
    padding: 0 24px 24px 0 !important;
    vertical-align: top !important;
  }

  .customer-info__item,
  .customer-info__item p,
  .customer-info__item-content {
    color: #6e6a60 !important;
    font-size: 14px !important;
    line-height: 1.55 !important;
  }

  /* ── Stopka ────────────────────────────────────────────────────── */

  .footer {
    background-color: #0e0e0c !important;
  }

  .footer__cell {
    padding: 32px 0 !important;
  }

  .disclaimer__subtext {
    margin: 0 !important;
    color: #ccc8bf !important;
    font-size: 12px !important;
    line-height: 1.55 !important;
  }

  .disclaimer__subtext a,
  .disclaimer__subtext a:visited {
    color: #ffffff !important;
  }

  /* ── Mobile ────────────────────────────────────────────────────── */

  @media only screen and (max-width: 640px) {
    .container {
      width: 100% !important;
      max-width: 100% !important;
    }

    .header__cell,
    .content__cell,
    .section__cell,
    .footer__cell {
      padding-right: 22px !important;
      padding-left: 22px !important;
    }

    .header__cell {
      padding-top: 24px !important;
      padding-bottom: 20px !important;
    }

    .shop-name__cell img {
      width: 132px !important;
    }

    .order-number__text,
    .po-number__text {
      font-size: 10px !important;
    }

    .content__cell {
      padding-top: 38px !important;
      padding-bottom: 34px !important;
    }

    .content h2 {
      font-size: 36px !important;
    }

    .content__body,
    .content__body p,
    .content p {
      font-size: 15px !important;
    }

    .receipt-heading-cell {
      padding: 26px 20px 6px !important;
    }

    .receipt-body > tbody > tr > td {
      padding: 0 20px 34px !important;
    }

    .receipt-burst,
    .receipt-burst-cell {
      width: 48px !important;
      height: 48px !important;
    }

    .subtotal-table--total .subtotal-line:first-child .subtotal-line__value,
    .subtotal-table--total .subtotal-line:first-child .subtotal-line__value strong {
      font-size: 30px !important;
    }

    .actions-buttons .button__cell,
    .actions-buttons .button__cell--primary,
    .actions-buttons .button__cell--shop-app,
    .actions-buttons .button__cell--separator {
      display: block !important;
      width: 100% !important;
    }

    .actions-buttons .button__cell--separator {
      height: 10px !important;
    }

    .customer-info__item {
      display: block !important;
      width: 100% !important;
      padding-right: 0 !important;
    }
  }
</style>
